name: Сообщить об ошибке
description: Воспроизводимый сбой или неверный результат Puls
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Спасибо за сообщение. Не публикуйте токены, IP-данные и другие чувствительные сведения.

  - type: input
    id: version
    attributes:
      label: Версия Puls
      description: Вывод команды `puls --version`.
      placeholder: Puls 1.0.0
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Система
      description: Операционная система и архитектура.
      placeholder: ALT Workstation, linux/amd64
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Сервис измерения
      options:
        - yandex
        - speedtest
        - all
        - Не относится к сервису измерения
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Команда
      description: Точная команда без чувствительных аргументов.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Приложите вывод с `--verbose`, если это безопасно.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Краткая последовательность действий и частота сбоя.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я использую актуальную версию Puls.
          required: true
        - label: Я удалил из сообщения чувствительные данные.
          required: true
