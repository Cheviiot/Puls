name: C++ migration

on:
  push:
    branches: [main, 'codex/cpp-*']
    paths: ['cpp/**', 'cmake/**', 'CMakeLists.txt', '.github/workflows/cpp.yml', 'internal/gui/assets/Icon.png', 'scripts/**']
  pull_request:
    paths: ['cpp/**', 'cmake/**', 'CMakeLists.txt', '.github/workflows/cpp.yml', 'internal/gui/assets/Icon.png', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Qt C++ / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python for Qt Windows metadata compatibility
        if: matrix.os == 'windows-2022'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore Qt 6.12 Windows amd64 SDK
        id: qt-windows-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}\puls-qt-6.12.0-windows-amd64
          key: puls-qt-6.12.0-windows-amd64-aqt3.3.0-msvc2022-v1
      - name: Install Qt 6.12 Windows amd64 with guarded Qt metadata compatibility
        if: matrix.os == 'windows-2022' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'aqtinstall-3.3.0'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check 'setuptools>=70.1.0' 'py7zr==1.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qtOutput = Join-Path $env:RUNNER_TEMP 'puls-qt-6.12.0-windows-amd64'
          & $python "$env:GITHUB_WORKSPACE/scripts/install_qt_windows_x64.py" --outputdir $qtOutput --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python "$env:GITHUB_WORKSPACE/scripts/install_qt_windows_x64.py" --outputdir $qtOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Qt 6.12 Windows amd64 SDK cache
        if: matrix.os == 'windows-2022' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}\puls-qt-6.12.0-windows-amd64
          key: puls-qt-6.12.0-windows-amd64-aqt3.3.0-msvc2022-v1
      - name: Set Qt 6.12 Windows amd64 SDK path
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_TEMP 'puls-qt-6.12.0-windows-amd64/6.12.0/msvc2022_64'
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $qtRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Qt
        if: matrix.os != 'windows-2022'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          modules: qtwebsockets
          aqtversion: '==3.3.0'
          cache: true
      - name: Configure
        run: cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DPULS_BUILD_GUI=ON
      - name: Build
        run: cmake --build build/cpp --config Debug --parallel 2
      - name: Test contracts and CLI
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/cpp -C Debug --output-on-failure --repeat until-fail:10
      - name: Install static analyzer
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Check native sources
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --std=c++20 --library=qt --suppress=missingIncludeSystem --inline-suppr
          -Icpp/include cpp/src cpp/tests
      - name: Test release tooling
        if: matrix.os == 'ubuntu-24.04'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -v

  windows-runtime-installer:
    name: Qt runtime installer / Windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise runtime install, update, rollback and uninstall
        shell: powershell
        run: ./scripts/tests/test_cpp_installer_windows.ps1

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          modules: qtwebsockets
          aqtversion: '==3.3.0'
          cache: true
      - name: Configure
        run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DPULS_BUILD_GUI=OFF -DPULS_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/asan --parallel 2
      - name: Test
        run: ctest --test-dir build/asan --output-on-failure
