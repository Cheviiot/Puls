name: C++

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: 4cb050be2cfa7a947cdd2dd1a70e24b17774c979
  VCPKG_DISABLE_METRICS: "1"

jobs:
  format:
    name: Форматирование C++
    # Pushes already check pull requests opened from branches of this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format-18 --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    # Linux builds with the graphical interface run in manylinux_2_28 so that
    # the executables need only glibc 2.28.
    container: ${{ matrix.container }}
    # The first build of Qt without a cached binary package takes most of it.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux · x64 · GUI
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            preset: release
            triplet: x64-linux
            gui: "ON"
          - name: Linux · ARM64 · GUI
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            preset: release
            triplet: arm64-linux
            gui: "ON"
          - name: Linux · Clang
            os: ubuntu-24.04
            preset: release
            triplet: x64-linux
            cc: clang-18
            cxx: clang++-18
            gui: "OFF"
          - name: Linux · ASan и UBSan
            os: ubuntu-24.04
            preset: sanitize
            triplet: x64-linux
            cc: clang-18
            cxx: clang++-18
            gui: "OFF"
          - name: Linux · TSan
            os: ubuntu-24.04
            preset: tsan
            triplet: x64-linux
            cc: clang-18
            cxx: clang++-18
            gui: "OFF"
          - name: macOS · ARM64 · GUI
            os: macos-15
            preset: release
            triplet: arm64-osx
            gui: "ON"
          - name: macOS · x64 · GUI
            os: macos-15-intel
            preset: release
            triplet: x64-osx
            gui: "ON"
          - name: Windows · x64 · GUI
            os: windows-2025
            preset: windows-release
            triplet: x64-windows-static-release
            msvc-arch: x64
            gui: "ON"
          - name: Windows · ARM64
            os: windows-11-arm
            preset: windows-arm64-release
            triplet: arm64-windows-static-release
            msvc-arch: arm64
            gui: "OFF"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Select compiler
        if: matrix.cxx != ''
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Install sanitizer runtime
        if: matrix.preset == 'sanitize' || matrix.preset == 'tsan'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-rt-18-dev
      - name: Install Qt build dependencies (manylinux)
        if: matrix.container != ''
        run: |
          .github/scripts/manylinux-dependencies.sh
          # Python for the Meson builds of vcpkg ports.
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      # Autotools for libb2, a dependency of qtbase.
      - name: Install Qt build tools (macOS)
        if: runner.os == 'macOS' && matrix.gui == 'ON'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install autoconf autoconf-archive automake libtool
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Set up vcpkg
        shell: bash
        run: |
          temp="${RUNNER_TEMP//\\//}"
          git init --quiet "$temp/vcpkg"
          git -C "$temp/vcpkg" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$temp/vcpkg" checkout --quiet FETCH_HEAD
          mkdir -p "$temp/vcpkg-binary-cache"
          {
            echo "VCPKG_ROOT=$temp/vcpkg"
            echo "VCPKG_BINARY_SOURCES=clear;files,$temp/vcpkg-binary-cache,readwrite"
            # Paths of sources that Qt generates while building exceed
            # MAX_PATH for MSVC under the default buildtrees directory.
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "VCPKG_CONFIGURE_ARGS=-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=${temp:0:2}/vb"
            fi
          } >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        # The statically linked musl build of vcpkg runs with the old glibc.
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics ${{ matrix.container && ''-musl'' || '''' }}'
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'
      # Cache entries are immutable, so every run that builds new packages
      # saves a new entry and later runs restore the newest one. A run that
      # fails while installing dependencies still keeps what it has built.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.os }}-${{ matrix.container && 'manylinux' || 'host' }}-${{ matrix.triplet }}-${{ matrix.cxx || 'default' }}-gui-${{ matrix.gui }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.container && 'manylinux' || 'host' }}-${{ matrix.triplet }}-${{ matrix.cxx || 'default' }}-gui-${{ matrix.gui }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/*.cmake') }}-
            vcpkg-${{ matrix.os }}-${{ matrix.container && 'manylinux' || 'host' }}-${{ matrix.triplet }}-${{ matrix.cxx || 'default' }}-gui-${{ matrix.gui }}-
      - name: Mark restored vcpkg packages
        shell: bash
        run: touch "${RUNNER_TEMP//\\//}/vcpkg-cache-restored"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPULS_WARNINGS_AS_ERRORS=ON -DPULS_SYSTEM_TLS_TESTS=ON -DPULS_BUILD_GUI=${{ matrix.gui }} ${{ env.VCPKG_CONFIGURE_ARGS }}
      - name: Find new vcpkg packages
        id: vcpkg-new
        if: always()
        shell: bash
        run: |
          temp="${RUNNER_TEMP//\\//}"
          marker="$temp/vcpkg-cache-restored"
          if [ -f "$marker" ] && [ -n "$(find "$temp/vcpkg-binary-cache" -type f -newer "$marker" -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Saved before building so that a compile error does not discard the
      # dependencies installed while configuring.
      - name: Save vcpkg packages
        if: always() && steps.vcpkg-new.outputs.found == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
