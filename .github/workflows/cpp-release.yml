name: C++ desktop packaging

on:
  push:
    branches: ['codex/cpp-*']
    paths:
      - 'cpp/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/cpp-release.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/cpp-release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Artifact version label
        required: false
        type: string
        default: 0.4.0-cpp-dev

env:
  RELEASE_VERSION: ${{ inputs.version || '0.4.0-cpp-dev' }}

permissions:
  contents: read

concurrency:
  group: cpp-release-${{ github.workflow }}-${{ github.ref }}
  # Preserve a cold source-SDK build across application-only updates. The SDK
  # is cached before packaging, and GitHub keeps only the latest pending run.
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.os }}/${{ matrix.arch }}${{ matrix.nogui && ' CLI' || ' GUI' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 6.12 binaries require glibc 2.34; source-built Qt here preserves the glibc 2.35 baseline.
          - {runner: ubuntu-22.04, os: linux, arch: amd64, qt-host: linux, qt-arch: linux_gcc_64, gui: ON}
          # Qt's supported Linux ARM desktop reference is Ubuntu 24.04 on Raspberry Pi 5 (glibc 2.39).
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, qt-host: linux_arm64, qt-arch: linux_gcc_arm64, gui: ON}
          - {runner: windows-2022, os: windows, arch: amd64, qt-host: windows, qt-arch: win64_msvc2022_64, gui: ON}
          # Native ARM runner with the Qt 6.12 MSVC 2022 ARM64 package repository.
          - {runner: windows-11-arm, os: windows, arch: arm64, qt-host: windows_arm64, qt-arch: win64_msvc2022_arm64, gui: OFF, nogui: true}
          - {runner: macos-15-intel, os: darwin, arch: amd64, qt-host: mac, qt-arch: clang_64, gui: ON}
          - {runner: macos-15, os: darwin, arch: arm64, qt-host: mac, qt-arch: clang_64, gui: ON}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Linux deployment tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf libgl1-mesa-dev libssl-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb1-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrender-dev libwayland-dev wayland-protocols \
            libwayland-egl1-mesa libwayland-server0 libgles2-mesa-dev

      - name: Cache Qt 6.12 Linux amd64 SDK
        id: qt-linux-cache
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland
          key: puls-qt-6.12.0-linux-amd64-glibc235-wayland-gcc11-98ff4f44bac6ec3e-v2

      - name: Build minimal Qt 6.12.0 Linux amd64 SDK from verified sources
        id: qt-linux-source
        if: matrix.os == 'linux' && matrix.arch == 'amd64' && steps.qt-linux-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          python3 scripts/build_qt_linux_sdk.py
          --cache-dir "$HOME/.cache/puls/qt-source-6.12.0"
          --work-dir "$RUNNER_TEMP/puls-qt-6.12.0-build"
          --prefix "$HOME/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland"
          --jobs 2

      - name: Save Qt 6.12 Linux amd64 SDK cache
        if: matrix.os == 'linux' && matrix.arch == 'amd64' && steps.qt-linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland
          key: puls-qt-6.12.0-linux-amd64-glibc235-wayland-gcc11-98ff4f44bac6ec3e-v2

      - name: Set Qt 6.12.0 Linux amd64 SDK path
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: |
          echo "QT_ROOT_DIR=$HOME/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland" >> "$GITHUB_ENV"
          echo "$HOME/.cache/puls/qt-6.12.0-linux-amd64-glibc235-wayland/bin" >> "$GITHUB_PATH"

      - name: Restore Qt 6.12 Windows amd64 SDK
        id: qt-windows-cache
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}\puls-qt-6.12.0-windows-amd64
          key: puls-qt-6.12.0-windows-amd64-aqt3.3.0-msvc2022-v1

      - name: Install Qt 6.12 Windows amd64 with guarded Qt metadata compatibility
        if: matrix.os == 'windows' && matrix.arch == 'amd64' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'aqtinstall-3.3.0'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check 'setuptools>=70.1.0' 'py7zr==1.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qtOutput = Join-Path $env:RUNNER_TEMP 'puls-qt-6.12.0-windows-amd64'
          & $python "$env:GITHUB_WORKSPACE/scripts/install_qt_windows_x64.py" --outputdir $qtOutput --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python "$env:GITHUB_WORKSPACE/scripts/install_qt_windows_x64.py" --outputdir $qtOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Qt 6.12 Windows amd64 SDK cache
        if: matrix.os == 'windows' && matrix.arch == 'amd64' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}\puls-qt-6.12.0-windows-amd64
          key: puls-qt-6.12.0-windows-amd64-aqt3.3.0-msvc2022-v1

      - name: Set Qt 6.12 Windows amd64 SDK path
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_TEMP 'puls-qt-6.12.0-windows-amd64/6.12.0/msvc2022_64'
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $qtRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Qt 6.12.0
        if: (matrix.os != 'linux' || matrix.arch == 'arm64') && !(matrix.os == 'windows' && matrix.arch == 'amd64')
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          modules: qtwebsockets
          aqtversion: '==3.3.0'
          cache: true
          set-env: true

      - name: Configure Release
        shell: bash
        run: >-
          cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPULS_DEPLOY_RUNTIME=ON
          -DPULS_BUILD_GUI=${{ matrix.gui }}
          -DPULS_VERSION_LABEL="$RELEASE_VERSION"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          ${{ matrix.os == 'windows' && matrix.arch == 'arm64' && '-T v143' || '' }}
          ${{ matrix.os == 'windows' && matrix.arch == 'arm64' && '-A ARM64' || '' }}

      - name: Build Release
        shell: bash
        run: cmake --build build/cpp --config Release --parallel 2

      - name: Install, relocate, and validate runtime
        shell: bash
        run: |
          cmake --install build/cpp --config Release --prefix "$PWD/.scratch/stage"
          mv .scratch/stage .scratch/relocated
          if [[ "${{ matrix.gui }}" == "ON" ]]; then
            python scripts/validate_cpp_runtime.py --stage .scratch/relocated --version "$RELEASE_VERSION" --target "${{ matrix.os }}/${{ matrix.arch }}" --gui
          else
            python scripts/validate_cpp_runtime.py --stage .scratch/relocated --version "$RELEASE_VERSION" --target "${{ matrix.os }}/${{ matrix.arch }}"
          fi

      - name: Create deterministic archive
        shell: bash
        run: |
          if [[ "${{ matrix.nogui || false }}" == "true" ]]; then
            python scripts/release_cpp.py package --version "$RELEASE_VERSION" --target "${{ matrix.os }}/${{ matrix.arch }}" --stage .scratch/relocated --output .scratch/archives --nogui
          else
            python scripts/release_cpp.py package --version "$RELEASE_VERSION" --target "${{ matrix.os }}/${{ matrix.arch }}" --stage .scratch/relocated --output .scratch/archives
          fi

      - name: Upload target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-desktop-${{ env.RELEASE_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: .scratch/archives/Puls_${{ env.RELEASE_VERSION }}_${{ matrix.os }}_${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble unsigned CI package set
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all six target archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.1
        with:
          pattern: cpp-desktop-${{ env.RELEASE_VERSION }}-*
          path: .scratch/archives
          merge-multiple: true

      - name: Assemble manifest, checksums, and installers
        run: >-
          python3 scripts/release_cpp.py assemble
          --version "${{ env.RELEASE_VERSION }}"
          --input .scratch/archives
          --output .scratch/assembled
          --install-sh scripts/install.sh
          --install-ps1 scripts/install.ps1

      - name: Verify checksums
        working-directory: .scratch/assembled
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload complete unsigned package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: puls-cpp-desktop
          path: .scratch/assembled/*
          if-no-files-found: error
          retention-days: 14
