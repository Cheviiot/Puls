name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Тесты и статический анализ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установка Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Проверка модулей
        run: go mod verify

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: Проверка GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Проверка установщиков
        shell: bash
        run: |
          shellcheck scripts/install.sh
          pwsh -NoProfile -File ./scripts/install.ps1 -Help

      - name: Модульные тесты с детектором гонок
        run: go test -race -count=1 ./...

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          install-go: false

  vulnerabilities:
    name: Проверка уязвимостей
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  windows-installer:
    name: Установщик Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установка Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Integration test установщика
        shell: pwsh
        run: go test -count=1 -run '^TestPowerShellInstaller' ./cmd/release

  macos-installer:
    name: Установщик macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установка Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Integration test установщика
        run: go test -count=1 -run '^TestShellInstaller' ./cmd/release

  package:
    name: Кроссплатформенные архивы
    needs: [checks, vulnerabilities, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установка Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Сборка архивов
        run: go run ./cmd/release --version "dev-${GITHUB_SHA::12}"

      - name: Проверка контрольных сумм
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Сохранение архивов
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Puls-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
