name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Версия для полного preflight без публикации, например 0.3.2
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          PREFLIGHT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Релизный тег должен иметь вид v1.2.3" >&2
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          else
            version=$PREFLIGHT_VERSION
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Версия preflight должна иметь вид 1.2.3" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "build=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Verify release tooling and installers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s cpp/android/ci -p 'test_*.py' -v
          shellcheck scripts/install.sh
          pwsh -NoProfile -File ./scripts/install.ps1 -Help
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail-with-body --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate workflows
        run: actionlint .github/workflows/*.yml

  desktop:
    name: Build desktop release packages
    needs: validate
    uses: ./.github/workflows/cpp-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  android:
    name: Build signed Android release package
    needs: validate
    uses: ./.github/workflows/cpp-android.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      version_code: ${{ needs.validate.outputs.build }}
    secrets:
      PULS_ANDROID_KEYSTORE_BASE64: ${{ secrets.PULS_ANDROID_KEYSTORE_BASE64 }}
      PULS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PULS_ANDROID_KEYSTORE_PASSWORD }}
      PULS_ANDROID_KEY_ALIAS: ${{ secrets.PULS_ANDROID_KEY_ALIAS }}
      PULS_ANDROID_KEY_PASSWORD: ${{ secrets.PULS_ANDROID_KEY_PASSWORD }}

  publish:
    name: Assemble and publish GitHub Release
    needs: [validate, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download desktop target archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.1
        with:
          pattern: cpp-desktop-${{ needs.validate.outputs.version }}-*
          path: .scratch/desktop
          merge-multiple: true
      - name: Download verified Android APK artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.1
        with:
          name: cpp-android-apk
          path: .scratch/android-artifact
      - name: Assemble complete release package set
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' -t android_apks < <(
            find .scratch/android-artifact -type f -name "Puls_${RELEASE_VERSION}_android.apk" -print0
          )
          if [[ "${#android_apks[@]}" -ne 1 ]]; then
            echo "Ожидался один подписанный APK версии $RELEASE_VERSION, найдено: ${#android_apks[@]}" >&2
            exit 1
          fi
          python3 scripts/release_cpp.py assemble \
            --version "$RELEASE_VERSION" \
            --input .scratch/desktop \
            --output dist \
            --android-apk "${android_apks[0]}" \
            --install-sh scripts/install.sh \
            --install-ps1 scripts/install.ps1
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Attest artifacts
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Create and upload draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_created=0
          cleanup_failed_release() {
            status=$?
            if [[ "$status" -ne 0 && "$release_created" -eq 1 ]]; then
              gh release delete "$GITHUB_REF_NAME" --yes || true
            fi
            exit "$status"
          }
          trap cleanup_failed_release EXIT
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Puls $GITHUB_REF_NAME"
          release_created=1
          for asset_path in dist/*; do
            if [[ "${asset_path##*/}" != "install.ps1" ]]; then
              gh release upload "$GITHUB_REF_NAME" "$asset_path"
            fi
          done
          release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary @dist/install.ps1 \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=install.ps1" \
            > /dev/null
          content_type=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq 'map(select(.name == "install.ps1")) | if length == 1 then .[0].content_type else "" end')
          if [[ "$content_type" != "text/plain; charset=utf-8" ]]; then
            echo "install.ps1 опубликован с неверным Content-Type: $content_type" >&2
            exit 1
          fi
          trap - EXIT
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
