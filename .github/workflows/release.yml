name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Публикация релиза
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Установка Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Проверка тега
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Тег должен иметь вид v1.2.3 или v1.2.3-rc.1" >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Проверка модулей
        run: go mod verify

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: Проверка GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Проверка установщиков
        shell: bash
        run: |
          shellcheck scripts/install.sh
          pwsh -NoProfile -File ./scripts/install.ps1 -Help

      - name: Десятикратный прогон модульных тестов
        run: go test -count=10 ./...

      - name: Модульные тесты с детектором гонок
        run: go test -race -count=1 ./...

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false

      - name: Проверка уязвимостей
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Сборка релизных архивов
        run: go run ./cmd/release --version "${{ steps.version.outputs.value }}"

      - name: Проверка контрольных сумм
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Аттестация происхождения артефактов
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Создание и загрузка черновика GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_created=0
          cleanup_failed_release() {
            status=$?
            if [[ "$status" -ne 0 && "$release_created" -eq 1 ]]; then
              gh release delete "$GITHUB_REF_NAME" --yes || true
            fi
            exit "$status"
          }
          trap cleanup_failed_release EXIT

          release_options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Puls $GITHUB_REF_NAME" \
            "${release_options[@]}"
          release_created=1

          for asset_path in dist/*; do
            if [[ "${asset_path##*/}" != "install.ps1" ]]; then
              gh release upload "$GITHUB_REF_NAME" "$asset_path"
            fi
          done

          release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary @dist/install.ps1 \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=install.ps1" \
            > /dev/null

          content_type=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq 'map(select(.name == "install.ps1")) | if length == 1 then .[0].content_type else "" end')
          if [[ "$content_type" != "text/plain; charset=utf-8" ]]; then
            echo "install.ps1 опубликован с неверным Content-Type: $content_type" >&2
            exit 1
          fi
          trap - EXIT

      - name: Публикация GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
