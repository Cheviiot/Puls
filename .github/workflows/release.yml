name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Версия для полного preflight без публикации, например 0.4.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve version
        id: version
        env:
          PREFLIGHT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Релизный тег должен иметь вид v1.2.3" >&2
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
            if ! grep -Fq "## [$version]" CHANGELOG.md; then
              echo "В CHANGELOG.md нет раздела [$version]" >&2
              exit 1
            fi
          else
            version=$PREFLIGHT_VERSION
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Версия preflight должна иметь вид 1.2.3" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "build=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

  # Builds, tests and packages the six desktop targets exactly as CI does.
  desktop:
    name: Desktop
    needs: validate
    uses: ./.github/workflows/cpp.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.validate.outputs.version }}

  android:
    name: Signed Android APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install bundletool
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          bundletool_bin="$RUNNER_TEMP/bundletool-bin"
          curl --fail-with-body --location --silent --show-error \
            --output "$bundletool_jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$bundletool_jar" | sha256sum --check --strict
          mkdir -p "$bundletool_bin"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$bundletool_jar" > "$bundletool_bin/bundletool"
          chmod 0755 "$bundletool_bin/bundletool"
          "$bundletool_bin/bundletool" version
          echo "$bundletool_bin" >> "$GITHUB_PATH"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PULS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/puls-release.keystore"
      - name: Build signed Android bundle and universal APK
        working-directory: cmd/puls
        env:
          KEYSTORE_PASS: ${{ secrets.PULS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PULS_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PULS_ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build }}
          GOFLAGS: -ldflags=-X=main.version=${{ needs.validate.outputs.version }}
        run: |
          test -n "$KEYSTORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          go run fyne.io/tools/cmd/fyne@v1.7.2 release \
            --target android --app-version "$RELEASE_VERSION" --app-build "$RELEASE_BUILD" \
            --tags migrated_fynedo \
            --keystore "$RUNNER_TEMP/puls-release.keystore" --keystore-pass "$KEYSTORE_PASS" \
            --key-name "$KEY_ALIAS" --key-pass "$KEY_PASS"

          mapfile -d '' -t bundle_files < <(find . -maxdepth 1 -type f -name '*.aab' -print0)
          if [[ "${#bundle_files[@]}" -ne 1 ]]; then
            echo "Ожидался один Android App Bundle, найдено: ${#bundle_files[@]}" >&2
            exit 1
          fi

          store_pass_file="$RUNNER_TEMP/puls-keystore.pass"
          key_pass_file="$RUNNER_TEMP/puls-key.pass"
          printf '%s\n' "$KEYSTORE_PASS" > "$store_pass_file"
          printf '%s\n' "$KEY_PASS" > "$key_pass_file"
          chmod 0600 "$store_pass_file" "$key_pass_file"
          trap 'rm -f "$store_pass_file" "$key_pass_file"' EXIT

          apk_set="$RUNNER_TEMP/puls.apks"
          apk_dir="$RUNNER_TEMP/puls-universal-apk"
          bundletool build-apks \
            --bundle="${bundle_files[0]}" --output="$apk_set" --mode=universal --overwrite \
            --ks="$RUNNER_TEMP/puls-release.keystore" --ks-key-alias="$KEY_ALIAS" \
            --ks-pass="file:$store_pass_file" --key-pass="file:$key_pass_file"
          mkdir -p "$apk_dir" ../../dist
          unzip -j "$apk_set" universal.apk -d "$apk_dir"
          install -m 0644 "$apk_dir/universal.apk" "../../dist/Puls_${RELEASE_VERSION}_android.apk"
      - name: Verify signature and permissions
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          apk="dist/Puls_${RELEASE_VERSION}_android.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Не найден universal APK: $apk" >&2
            exit 1
          fi
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -1)
          apksigner="$build_tools_dir/apksigner"
          aapt2="$build_tools_dir/aapt2"
          for tool in "$apksigner" "$aapt2"; do
            if [[ ! -x "$tool" ]]; then
              echo "Не найден Android verifier: $tool" >&2
              exit 1
            fi
          done
          "$apksigner" verify --verbose --print-certs "$apk"
          permissions=$("$aapt2" dump permissions "$apk")
          printf '%s\n' "$permissions"
          grep -Fq 'android.permission.INTERNET' <<< "$permissions"
          if grep -Eq 'ACCESS_(FINE|COARSE)_LOCATION|READ_PHONE_STATE|READ_CONTACTS|RECORD_AUDIO|CAMERA' <<< "$permissions"; then
            echo "APK запрашивает лишние чувствительные разрешения" >&2
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    needs: [validate, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download desktop packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Download Android APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.1
        with:
          name: android-apk
          path: dist
      - name: Assemble release metadata
        run: >-
          python3 scripts/release.py assemble --require-android
          --version "${{ needs.validate.outputs.version }}" --output dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Attest artifacts
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - name: Create and upload draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_created=0
          cleanup_failed_release() {
            status=$?
            if [[ "$status" -ne 0 && "$release_created" -eq 1 ]]; then
              gh release delete "$GITHUB_REF_NAME" --yes || true
            fi
            exit "$status"
          }
          trap cleanup_failed_release EXIT
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Puls $GITHUB_REF_NAME"
          release_created=1
          for asset_path in dist/*; do
            if [[ "${asset_path##*/}" != "install.ps1" ]]; then
              gh release upload "$GITHUB_REF_NAME" "$asset_path"
            fi
          done
          release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary @dist/install.ps1 \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=install.ps1" \
            > /dev/null
          content_type=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq 'map(select(.name == "install.ps1")) | if length == 1 then .[0].content_type else "" end')
          if [[ "$content_type" != "text/plain; charset=utf-8" ]]; then
            echo "install.ps1 опубликован с неверным Content-Type: $content_type" >&2
            exit 1
          fi
          trap - EXIT
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
